name: Deploy to VPS

# Pipeline se pokreće pri svakom pushu na main granu
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Spaja se na VPS preko SSH i pokreće deploy komande
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/FitnessTracker
            git pull
            export GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"
            docker compose down
            docker compose up -d --build