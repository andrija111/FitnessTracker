services:
  mysql:
    image: mysql:8.0
    container_name: fitnesstracker-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fitnesstracker
      MYSQL_USER: fitness
      MYSQL_PASSWORD: fitness123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: